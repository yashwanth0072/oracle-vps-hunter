name: Oracle A1 Always Free VPS Hunter

on:
  schedule:
    # Every five minutes, offset from the top of the hour to reduce queue delays.
    - cron: '3/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-vps-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Report trigger
        run: |
          echo "Workflow event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule || 'manual / non-schedule trigger' }}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: python -m pip install --upgrade pip oci

      - name: Prepare OCI credentials
        shell: bash
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CONFIG" > "$HOME/.oci/config"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 700 "$HOME/.oci"
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"

      - name: Try provisioning one time
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          python oci_free_vps.py \
            --confirm-always-free \
            --ssh-key "$SSH_PUBLIC_KEY" \
            --max-attempts 1
